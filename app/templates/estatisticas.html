{% extends "base.html" %}
{% block title %}Estatísticas{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <canvas id="mediasChart"></canvas>
        </div>
    </div>
</div>

<script>
    const nomes = JSON.parse('{{ nomes|tojson|safe }}');
    const medias = JSON.parse('{{ medias|tojson|safe }}').map(m => m === null ? 0 : m);
    
    const barColors = nomes.map((_, i) => {
        const palette = [
            'rgba(54, 162, 235, 0.7)',
            'rgba(255, 99, 132, 0.7)',
            'rgba(255, 206, 86, 0.7)',
            'rgba(75, 192, 192, 0.7)',
            'rgba(153, 102, 255, 0.7)',
            'rgba(255, 159, 64, 0.7)'
        ];
        return palette[i % palette.length];
    });

    new Chart(document.getElementById('mediasChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: nomes,
            datasets: [{
                label: 'Média das avaliações',
                data: medias,
                backgroundColor: barColors,
                borderColor: barColors.map(c => c.replace('0.7', '1')),
                borderWidth: 2,
                borderRadius: 8,
                hoverBackgroundColor: barColors.map(c => c.replace('0.7', '0.9')),
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Média das avaliações dos produtos',
                    font: { size: 18, weight: 'bold' },
                    color: '#222',
                    padding: { top: 10, bottom: 20 }
                },
                legend: {
                    display: true,
                    position: 'top',
                    labels: {
                        font: { size: 14 },
                        color: '#222'
                    }
                },
                tooltip: {
                    enabled: true,
                    callbacks: {
                        label: function(context) {
                            return `Média: ${context.parsed.y.toFixed(2)}`;
                        }
                    },
                    backgroundColor: '#fff',
                    titleColor: '#222',
                    bodyColor: '#222',
                    borderColor: '#36A2EB',
                    borderWidth: 1
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    title: {
                        display: true,
                        text: 'Produtos',
                        font: { size: 14 },
                        color: '#222'
                    },
                    ticks: { font: { size: 13 }, color: '#222' }
                },
                y: {
                    beginAtZero: true,
                    max: 5,
                    grid: { color: 'rgba(54, 162, 235, 0.1)' },
                    title: {
                        display: true,
                        text: 'Nota média',
                        font: { size: 14 },
                        color: '#222'
                    },
                    ticks: { stepSize: 1, font: { size: 13 }, color: '#222' }
                }
            }
        }
    });
</script>
{% endblock %}
