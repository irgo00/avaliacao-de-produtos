{% extends "base.html" %}
{% block title %}Produtos{% endblock %}

{% block content %}
<h2>Lista de Produtos</h2>

<form action="{{ url_for('add_produto') }}" method="POST" class="mb-4">
    <div class="row">
        <div class="col-md-4">
            <input type="text" name="nome" class="form-control" placeholder="Nome do produto" required>
        </div>
        <div class="col-md-6">
            <input type="text" name="descricao" class="form-control" placeholder="Descrição" required>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100">Adicionar</button>
        </div>
    </div>
</form>

<ul class="list-group">
    {% for produto in produtos %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ produto.nome }}
        <a href="{{ url_for('produto', id=produto.id) }}" class="btn btn-sm btn-secondary">Ver detalhes</a>
    </li>
    {% else %}
    <li class="list-group-item">Nenhum produto cadastrado.</li>
    {% endfor %}
</ul>
{% endblock %}
